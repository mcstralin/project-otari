# Otari routing policies for Otari-Guard.
# Create them on the Otari dashboard (Routing page) or in a self-hosted config.yml under
# `routing: policies:`. Then enable them in .otari-guard.yml:
#
#   policies:
#     patcher: guard-patcher
#     reviewer: guard-reviewer
#
# Two layers of escalation:
#   - Otari (server-side): provider/model outages fail over via `on_failure`, and
#     `budget_used_pct` downgrades to cheaper open-weight models as a budget runs low.
#   - Otari-Guard (client-side): when tests still fail in the sandbox, it escalates
#     from the cheap patcher tier to the large coder tier.

routing:
  policies:
    guard-patcher:
      select:
        # Budget nearly gone? Stay on the cheapest capable open-weight coder.
        - when:
            budget_used_pct: { gt: 80 }
          target: alibaba/qwen3-coder-30b-a3b-instruct
        - default: alibaba/qwen3-coder-30b-a3b-instruct
      on_failure:
        - mistralai/devstral-2-123b
        - alibaba/qwen3-coder-480b-a35b-instruct-turbo

    guard-reviewer:
      select:
        - when:
            budget_used_pct: { gt: 80 }
          target: openai/gpt-oss-120b
        - default: deepseek/deepseek-v4-flash
      on_failure:
        - alibaba/qwen-3.5-397b-a17b
