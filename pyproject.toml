[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otari-guard"
version = "0.1.0"
description = "Self-healing CI agent on open-weight models, governed by Otari: proves fixes in a sandbox, opens PRs with a receipt, never exceeds its budget."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
otari-guard = "otari_guard.cli:main"

[tool.setuptools.packages.find]
include = ["otari_guard*"]

[tool.setuptools.package-data]
otari_guard = ["templates/otari/*.yml", "templates/otari/verifiers/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
